[defaults]
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
inventory = inventory/generated.ini
deprecation_warnings = False
vault_password_file = /app/ansible/vault_pass.sh
remote_user = admin
transport = paramiko

[ssh_connection]
pty = True
pipelining = True
ssh_args = -o PreferredAuthentications=password -o PubkeyAuthentication=no

[paramiko_connection]
look_for_keys = False
host_key_auto_add = True
